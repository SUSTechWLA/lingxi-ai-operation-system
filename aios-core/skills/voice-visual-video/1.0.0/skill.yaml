name: voice-visual-video
version: "1.0.0"
description: 文字口播可视化视频 — 观点分析、口播稿生成、Visual Beat 规划、组件 DSL、HyperGenKeyframe Bundle
category: video
stages:
  - name: intent_analysis
    instruction: stages/intent_analysis.md
    output_schema: schemas/intent_output.json
  - name: narration
    instruction: stages/narration.md
    output_schema: schemas/narration_beat.json
    approval_required: true
  - name: visual_design
    instruction: stages/visual_design.md
    optional: true
  - name: beat_planning
    instruction: stages/beat_planning.md
    output_schema: schemas/visual_beat.json
    approval_required: true
  - name: component_dsl
    instruction: stages/component_dsl.md
    output_schema: schemas/component_dsl.json
  - name: image_generation
    instruction: stages/image_generation.md
    optional: true
  - name: bundle_assemble
    instruction: stages/bundle_assemble.md
  - name: render_review
    instruction: stages/render_review.md
    approval_required: true
requires:
  text_to_text: true
  text_to_image: true
