name: film-shot-reconstruction
version: "1.0.0"
description: 电影镜头拉片重构流水线：切镜头、运动分析、原创参考资产、合成关键帧、故事板、资产检查和素材库入库。
category: video
stages:
  - name: input_prepare
    kind: TOOL
    tool: video_shot_extractor
    instruction: stages/input_prepare.md
    long_running: true
    heartbeat_timeout_sec: 1200
  - name: motion_analysis
    kind: TOOL
    tool: shot_motion_analyzer
    instruction: stages/motion_analysis.md
    long_running: true
    heartbeat_timeout_sec: 1200
  - name: reconstruction_plan
    instruction: stages/reconstruction_plan.md
    approval_required: true
  - name: reference_prompts
    instruction: stages/reference_prompts.md
    approval_required: true
  - name: reference_images
    kind: TOOL
    tool: image_asset_generator
    instruction: stages/reference_images.md
    approval_required: true
    long_running: true
    heartbeat_timeout_sec: 1800
  - name: synthetic_keyframes
    kind: TOOL
    tool: image_asset_generator
    instruction: stages/synthetic_keyframes.md
    approval_required: true
    long_running: true
    heartbeat_timeout_sec: 1800
  - name: storyboard
    kind: TOOL
    tool: storyboard_assembler
    instruction: stages/storyboard.md
    approval_required: true
  - name: reconstruction_package
    instruction: stages/reconstruction_package.md
  - name: asset_guard
    kind: TOOL
    tool: asset_guard
    instruction: stages/asset_guard.md
  - name: material_library_import
    kind: TOOL
    tool: material_library_importer
    instruction: stages/material_library_import.md
    optional: true
    approval_required: true
