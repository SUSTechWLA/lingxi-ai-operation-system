name: video_prompt_quality_checker
description: 检查视频生成提示词的完整性、可执行性、风格统一性和模型兼容性，输出质量评分和修复建议。
type: builtin_prompt_tool
version: 1.0.0
endpoint: builtin://video-creation/video_prompt_quality_checker
timeout: 120

capabilities:
  - video_creation
  - quality_check
  - prompt_review
tags:
  - video
  - quality
  - prompt
  - review

parameters:
  videoPrompts:
    type: array
    required: true
    description: 待检查的视频提示词列表
  brief:
    type: string
    required: false
    description: 用户的视频创作需求

output:
  passed:
    type: boolean
    description: 是否通过质量检查
  score:
    type: number
    description: 质量评分 0-100
  issues:
    type: array
    description: 发现的问题列表
  repairSuggestions:
    type: array
    description: 修复建议

costLevel: low
latencyLevel: medium
riskLevel: low
sideEffect: false
idempotent: true

approvalPolicy:
  required: false
  mode: none
  reason: 质量检查结果作为参考，不需要单独审核。

artifactPolicy:
  produceArtifact: true
  artifactKinds:
    - JSON
  defaultReviewRequired: false

nextRecommendedTools:
  - publish_copy_generator
  - video_package_exporter
