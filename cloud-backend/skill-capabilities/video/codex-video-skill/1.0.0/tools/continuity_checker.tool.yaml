name: continuity_checker
description: 检查脚本、卡片、composition 和参考资产之间的术语、风格、画幅和视觉一致性。
type: builtin_prompt_tool
executionPlane: cloud
requiresUserDevice: false
artifactLocation: cloud
version: 1.0.0
endpoint: builtin://video-creation/continuity_checker
timeout: 60

capabilities:
  - video_creation
  - continuity_check
tags:
  - video
  - continuity

parameters:
  proposal:
    type: object
    required: false
  script:
    type: string
    required: false
  cardPlan:
    type: object
    required: false
  compositionSpec:
    type: object
    required: false

output:
  continuityReport:
    type: object
  styleProfile:
    type: object
  staleArtifactReport:
    type: object
  artifacts:
    type: object

artifactPolicy:
  produceArtifact: true
  artifactKinds:
    - CONTINUITY_REPORT
    - STYLE_PROFILE
  defaultReviewRequired: false

costLevel: low
riskLevel: low
sideEffect: false
idempotent: true
