name: package_quality_checker
description: 视频创作包最终质检，检查所有必需文件是否齐全、是否已审核通过、字段是否完整、格式是否正确。
type: builtin_prompt_tool
version: 1.0.0
endpoint: builtin://video-creation/package_quality_checker
timeout: 120

capabilities:
  - video_creation
  - quality_check
  - package_review
tags:
  - video
  - quality
  - package
  - review

parameters:
  brief:
    type: string
    required: true
    description: 用户的视频创作需求
  script:
    type: string
    required: false
    description: 口播稿
  shotList:
    type: array
    required: false
    description: 分镜列表
  videoPrompts:
    type: array
    required: false
    description: 视频提示词
  publishCopy:
    type: object
    required: false
    description: 发布文案

output:
  passed:
    type: boolean
    description: 是否通过质量检查
  score:
    type: number
    description: 质量评分 0-100
  issues:
    type: array
    description: 发现的问题列表
  repairSuggestions:
    type: array
    description: 修复建议
  missingArtifacts:
    type: array
    description: 缺失的产物列表
  unreviewedArtifacts:
    type: array
    description: 未审核的产物列表

costLevel: low
latencyLevel: medium
riskLevel: low
sideEffect: false
idempotent: true

approvalPolicy:
  required: false
  mode: none
  reason: 质量检查结果作为参考，不需要单独审核。

artifactPolicy:
  produceArtifact: true
  artifactKinds:
    - JSON
  defaultReviewRequired: false

nextRecommendedTools: []
