name: shot_splitter
description: 将已确认的口播稿或视频创意拆成短视频分镜。
type: builtin_prompt_tool
version: 1.0.0
endpoint: builtin://video-creation/shot_splitter
timeout: 120

capabilities:
  - video_creation
  - storyboard_generation
  - shot_planning
tags:
  - video
  - shot
  - storyboard

parameters:
  script:
    type: string
    required: true
    description: 已确认的口播稿正文
  brief:
    type: string
    required: false
    description: 用户的视频创作需求
  shotDurationRule:
    type: string
    required: false
    default: 3-15秒
    description: 镜头时长规则
  aspectRatio:
    type: string
    required: false
    default: 16:9
    description: 视频画幅

output:
  shotList:
    type: array
    description: 分镜列表
  totalDurationSec:
    type: number
    description: 总时长（秒）
  summary:
    type: string
    description: 分镜概览
  content:
    type: string
    description: 分镜清单
  artifacts:
    type: object
    description: 可审核的分镜产物索引

costLevel: low
latencyLevel: medium
riskLevel: low
sideEffect: false
idempotent: true

promptRef: prompts/shot_splitter.prompt.md
resourceRefs:
  - rules/shot_rules.md
  - references/camera_language_reference.md
  - examples/example_shot_list.json

approvalPolicy:
  required: true
  mode: after_artifact
  blocksDownstream: true
  reason: 分镜会影响后续视频提示词和生成成本，必须确认后继续。
  reviewArtifactKinds:
    - JSON
    - MARKDOWN

artifactPolicy:
  produceArtifact: true
  artifactKinds:
    - MARKDOWN
  defaultReviewRequired: true

qualityPolicy:
  required: true
  checkerTool: shot_quality_checker
  minScore: 85
  autoRepair: true
  maxRepairAttempts: 1

nextRecommendedTools:
  - shot_quality_checker
  - keyframe_prompt_generator
  - video_prompt_generator
