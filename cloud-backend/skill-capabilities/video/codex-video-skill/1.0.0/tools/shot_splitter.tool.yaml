name: shot_splitter
description: 将已确认的口播稿或视频创意拆成短视频分镜。
type: builtin_prompt_tool
version: 1.0.0
endpoint: builtin://video-creation/shot_splitter
timeout: 120

capabilities:
  - video_creation
  - storyboard_generation
  - shot_planning
tags:
  - video
  - shot
  - storyboard

parameters:
  brief:
    type: string
    required: true
    description: 用户的视频创作需求

output:
  content:
    type: string
    description: 分镜清单
  artifacts:
    type: object
    description: 可审核的分镜产物索引

costLevel: low
latencyLevel: medium
riskLevel: low
sideEffect: false
idempotent: true

approvalPolicy:
  required: true
  mode: after_artifact
  blocksDownstream: true
  reason: 分镜会影响后续视频提示词和生成成本，必须确认后继续。
  reviewArtifactKinds:
    - JSON
    - MARKDOWN

artifactPolicy:
  produceArtifact: true
  artifactKinds:
    - MARKDOWN
  defaultReviewRequired: true

nextRecommendedTools:
  - video_prompt_generator
