name: artifact_packager
version: "1.0"
type: local_tool
description: 将最终视频、项目元数据、质检报告打包为可下载的 ZIP 文件。
endpoint: builtin://video-creation/artifact_packager

executionPlane: local
requiresUserDevice: true
artifactLocation: local
localCommand: ARTIFACT_PACKAGE

localRequirements:
  os:
    - darwin
    - windows
    - linux
  commands: []
  minDiskMb: 512
  requiresNetwork: false

capabilities:
  - artifact_package
  - export

parameters:
  projectId:
    type: string
    required: true
  include:
    type: array
    required: true
    description: 需要打包的文件路径列表。
  output:
    type: string
    required: true
    description: 输出 ZIP 文件路径。

output:
  success:
    type: boolean
  artifacts:
    type: array
  summary:
    type: string

approvalPolicy:
  required: false

artifactPolicy:
  produceArtifact: true
  artifactKinds:
    - PROJECT_PACKAGE
  defaultReviewRequired: false

nextRecommendedTools: []

tags:
  - export
  - package

costLevel: low
riskLevel: low
sideEffect: true
idempotent: false
