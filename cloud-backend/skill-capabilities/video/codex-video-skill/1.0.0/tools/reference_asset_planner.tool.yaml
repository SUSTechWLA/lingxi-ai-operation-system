name: reference_asset_planner
description: 为图文视频选择背景、图标、字体和风格参考策略。
type: builtin_prompt_tool
executionPlane: cloud
requiresUserDevice: false
artifactLocation: cloud
version: 1.0.0
endpoint: builtin://video-creation/reference_asset_planner
timeout: 60

capabilities:
  - video_creation
  - reference_asset_plan
tags:
  - video
  - reference
  - style

parameters:
  proposal:
    type: object
    required: false
  compositionSpec:
    type: object
    required: false

output:
  referenceAssetPlan:
    type: object
  artifacts:
    type: object

artifactPolicy:
  produceArtifact: true
  artifactKinds:
    - REFERENCE_ASSET_PLAN
  defaultReviewRequired: false

costLevel: low
riskLevel: low
sideEffect: false
idempotent: true
