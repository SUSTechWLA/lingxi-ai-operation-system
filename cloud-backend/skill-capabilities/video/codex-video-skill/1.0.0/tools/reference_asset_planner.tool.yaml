name: reference_asset_planner
description: 为图文视频选择背景、图标、字体和风格参考策略。
type: builtin_prompt_tool
executionPlane: cloud
requiresUserDevice: false
artifactLocation: cloud
version: 1.0.0
endpoint: builtin://video-creation/reference_asset_planner
timeout: 60

capabilities:
  - video_creation
  - reference_asset_plan
  - cinematic_story
  - multi_view_reference_assets
tags:
  - video
  - reference
  - style
  - cinematic

parameters:
  proposal:
    type: object
    required: false
  compositionSpec:
    type: object
    required: false
  script:
    type: string
    required: false
  storyOutline:
    type: object
    required: false
  detailedScript:
    type: string
    required: false
  characters:
    type: array
    required: false
  scenes:
    type: array
    required: false
  props:
    type: array
    required: false
  continuityBible:
    type: object
    required: false
  creationProfile:
    type: object
    required: false

output:
  referenceAssetPlan:
    type: object
  referenceAssetIndex:
    type: array
  globalReferenceAssets:
    type: array
  externalGenerationRequests:
    type: array
  artifacts:
    type: object

artifactPolicy:
  produceArtifact: true
  artifactKinds:
    - REFERENCE_ASSET_PLAN
  defaultReviewRequired: false

costLevel: low
riskLevel: low
sideEffect: false
idempotent: true
