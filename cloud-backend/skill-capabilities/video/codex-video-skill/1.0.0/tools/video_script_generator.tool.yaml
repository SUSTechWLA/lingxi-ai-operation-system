name: video_script_generator
description: 根据用户选题、平台和风格生成短视频口播稿。
type: builtin_prompt_tool
version: 1.0.0
endpoint: builtin://video-creation/video_script_generator
timeout: 120

capabilities:
  - video_creation
  - script_generation
  - short_video
tags:
  - video
  - script
  - talking_head

parameters:
  topic:
    type: string
    required: true
    description: 视频主题
  brief:
    type: string
    required: false
    description: 用户的视频创作需求
  facts:
    type: array
    required: false
    description: 事实材料
  style:
    type: string
    required: false
    description: 口播风格（真诚、有知识感、幽默等）
  targetDurationSec:
    type: number
    required: false
    description: 目标时长（秒）
  platform:
    type: string
    required: false
    description: 发布平台

output:
  script:
    type: string
    description: 口播稿正文
  summary:
    type: string
    description: 内容摘要
  estimatedDurationSec:
    type: number
    description: 估算时长（秒）
  sections:
    type: array
    description: 分段信息
  qualityHints:
    type: object
    description: 质量提示（hasHook/hasStory/hasKnowledgeValue）
  content:
    type: string
    description: 口播稿正文
  artifacts:
    type: object
    description: 可审核的口播稿产物索引

costLevel: low
latencyLevel: medium
riskLevel: low
sideEffect: false
idempotent: true

promptRef: prompts/video_script_generator.prompt.md
resourceRefs:
  - rules/global.md
  - rules/script_rules.md
  - references/knowledge_video_style.md
  - examples/example_script.md

approvalPolicy:
  required: true
  mode: after_artifact
  blocksDownstream: true
  reason: 口播稿会影响后续分镜和视频提示词，必须确认后继续。
  reviewArtifactKinds:
    - MARKDOWN

artifactPolicy:
  produceArtifact: true
  artifactKinds:
    - MARKDOWN
  defaultReviewRequired: true

qualityPolicy:
  required: true
  checkerTool: script_quality_checker
  minScore: 85
  autoRepair: true
  maxRepairAttempts: 1

nextRecommendedTools:
  - script_quality_checker
  - shot_splitter
