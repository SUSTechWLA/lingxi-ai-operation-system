name: video_script_generator
description: 根据用户选题、平台和风格生成短视频口播稿。
type: builtin_prompt_tool
executionPlane: cloud
requiresUserDevice: false
artifactLocation: cloud
version: 1.0.0
endpoint: builtin://video-creation/video_script_generator
timeout: 120

capabilities:
  - video_creation
  - script_generation
  - short_video
  - cinematic_story
  - character_scene_prop_dossiers
tags:
  - video
  - script
  - talking_head
  - cinematic

parameters:
  topic:
    type: string
    required: true
    description: 视频主题
  brief:
    type: string
    required: false
    description: 用户的视频创作需求
  facts:
    type: array
    required: false
    description: 事实材料
  style:
    type: string
    required: false
    description: 口播风格（真诚、有知识感、幽默等）
  targetDurationSec:
    type: number
    required: false
    description: 目标时长（秒）
  platform:
    type: string
    required: false
    description: 发布平台
  proposal:
    type: object
    required: false
    description: 影视故事基础、选题提案或创意简报
  creationProfile:
    type: object
    required: false
    description: 视频创作 profile，cinematic_story 时输出影视剧本和角色/场景/道具档案
  knowledgeContext:
    type: object
    required: false
    description: 事实、来源、证据和上游工具上下文
  retrievalPolicy:
    type: string
    required: false
    description: none|optional|required|forbidden

output:
  script:
    type: string
    description: 口播稿正文
  storyOutline:
    type: object
    description: 影视故事大纲，包含主题、节拍、冲突和结尾
  detailedScript:
    type: string
    description: 影视详细剧本，包含动作节拍、场景推进和对白/旁白线索
  characters:
    type: array
    description: 主要角色档案，包含不变项、视觉锁定和参考视角要求
  scenes:
    type: array
    description: 主要场景档案，包含空间结构、光源、氛围和参考视角要求
  props:
    type: array
    description: 主要道具档案，包含材质、状态变化和多视角参考要求
  scriptSpans:
    type: array
    description: 可映射到 shot/time window 的剧本或口播时间段
  summary:
    type: string
    description: 内容摘要
  estimatedDurationSec:
    type: number
    description: 估算时长（秒）
  sections:
    type: array
    description: 分段信息
  qualityHints:
    type: object
    description: 质量提示（hasHook/hasStory/hasKnowledgeValue）
  content:
    type: string
    description: 口播稿正文
  artifacts:
    type: object
    description: 可审核的口播稿产物索引
  usedFacts:
    type: array
    description: 已使用事实
  unusedFacts:
    type: array
    description: 未使用事实
  factCheckWarnings:
    type: array
    description: 事实核验或素材风险提示
  knowledgeTrace:
    type: object
    description: 知识引用和来源追踪

costLevel: low
latencyLevel: medium
riskLevel: low
sideEffect: false
idempotent: true

promptRef: prompts/video_script_generator.prompt.md
resourceRefs:
  - rules/global.md
  - rules/script_rules.md
  - references/knowledge_video_style.md
  - examples/example_script.md

approvalPolicy:
  required: true
  mode: after_artifact
  blocksDownstream: true
  reason: 口播稿会影响后续分镜和视频提示词，必须确认后继续。

humanReview:
  required: true
  gate: after_artifact
  title: 审核口播脚本
  reviewFocus:
    - 开头是否有吸引力
    - 口播是否自然
    - 内容是否准确
    - 时长是否匹配
  userActions:
    - approve
    - edit
    - regenerate
    - reject
  reviewArtifactKinds:
    - MARKDOWN

artifactPolicy:
  produceArtifact: true
  artifactKinds:
    - VIDEO_SCRIPT
    - SCRIPT_SECTIONS
  defaultReviewRequired: true

qualityPolicy:
  required: true
  checkerTool: script_quality_checker
  minScore: 85
  autoRepair: true
  maxRepairAttempts: 1

nextRecommendedTools:
  - script_quality_checker
  - shot_splitter
