name: video_script_generator
description: 根据用户选题、平台和风格生成短视频口播稿。
type: builtin_prompt_tool
version: 1.0.0
endpoint: builtin://video-creation/video_script_generator
timeout: 120

capabilities:
  - video_creation
  - script_generation
  - short_video
tags:
  - video
  - script
  - talking_head

parameters:
  brief:
    type: string
    required: true
    description: 用户的视频创作需求
  platform:
    type: string
    required: false
    description: 发布平台

output:
  content:
    type: string
    description: 口播稿正文
  artifacts:
    type: object
    description: 可审核的口播稿产物索引

costLevel: low
latencyLevel: medium
riskLevel: low
sideEffect: false
idempotent: true

approvalPolicy:
  required: true
  mode: after_artifact
  blocksDownstream: true
  reason: 口播稿会影响后续分镜和视频提示词，必须确认后继续。
  reviewArtifactKinds:
    - MARKDOWN

artifactPolicy:
  produceArtifact: true
  artifactKinds:
    - MARKDOWN
  defaultReviewRequired: true

nextRecommendedTools:
  - shot_splitter
