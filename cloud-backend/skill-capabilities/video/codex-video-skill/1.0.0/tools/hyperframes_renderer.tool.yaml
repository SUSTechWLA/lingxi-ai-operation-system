name: hyperframes_renderer
description: 调用 HyperFrames Render Service 将 HyperFrames HTML 项目渲染为 MP4 视频文件，不依赖 CLI。渲染耗时较长且会产生大文件。
type: local_tool
version: 1.0.0
endpoint: builtin://video-creation/hyperframes_renderer
timeout: 1800
executionPlane: local
requiresUserDevice: true
artifactLocation: local
localCommand: HYPERFRAMES_RENDER

localRequirements:
  os:
    - darwin
    - windows
    - linux
  commands:
    - node
    - ffmpeg
  minDiskMb: 2048
  requiresNetwork: false

capabilities:
  - video_creation
  - hyperframes_render
  - html_to_video
  - mp4_render
tags:
  - hyperframes
  - render
  - mp4
  - final_video

parameters:
  projectDir:
    type: string
    required: true
    description: HyperFrames 项目目录路径
  entry:
    type: string
    required: false
    default: index.html
    description: 入口 HTML 文件名
  fps:
    type: number
    required: false
    default: 30
    description: 帧率
  quality:
    type: string
    required: false
    default: standard
    description: 渲染质量（draft/standard/high）
  format:
    type: string
    required: false
    default: mp4
    description: 输出格式（mp4/webm）

output:
  outputPath:
    type: string
    description: 渲染输出的 mp4 文件路径
  artifact:
    type: object
    description: VIDEO 产物元数据
  jobId:
    type: string
    description: 渲染任务 ID
  summary:
    type: string
    description: 渲染结果摘要

costLevel: high
latencyLevel: high
riskLevel: medium
sideEffect: true
idempotent: false

approvalPolicy:
  required: true
  mode: before_execute
  blocksDownstream: true
  reason: 渲染视频耗时较长且会产生大文件，必须用户确认后执行。

humanReview:
  required: true
  gate: before_execute
  title: 确认最终渲染
  reviewFocus:
    - 预览画面是否已确认
    - 视频结构是否正确
    - 是否允许开始本地渲染
  userActions:
    - approve
    - reject
    - back_to_preview
  reviewArtifactKinds:
    - HTML
    - SNAPSHOT
    - VIDEO

artifactPolicy:
  produceArtifact: true
  artifactKinds:
    - VIDEO
    - RENDER_REPORT
  defaultReviewRequired: true

nextRecommendedTools:
  - video_package_exporter
  - package_quality_checker
