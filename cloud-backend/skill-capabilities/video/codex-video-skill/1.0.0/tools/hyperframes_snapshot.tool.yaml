name: hyperframes_snapshot
version: "1.0"
type: local_tool
description: 对已生成的 HyperFrames HTML 项目进行预览截图，生成多时间点静态画面供用户审核确认。

executionPlane: local
requiresUserDevice: true
artifactLocation: local
localCommand: HYPERFRAMES_SNAPSHOT

localRequirements:
  os:
    - darwin
    - windows
    - linux
  commands:
    - node
  minDiskMb: 512
  requiresNetwork: false

capabilities:
  - hyperframes
  - preview
  - snapshot

parameters:
  projectDir:
    type: string
    required: true
    description: HyperFrames 项目目录路径。
  entry:
    type: string
    required: false
    default: index.html
  timePoints:
    type: array
    required: false
    description: 需要截图的秒数，默认 [0, 25%, 50%, 75%, last]。

output:
  artifactKind:
    type: string
  snapshots:
    type: array
  count:
    type: number

approvalPolicy:
  required: true
  mode: after_artifact
  blocksDownstream: true
  reason: 用户必须确认预览画面后才能进入最终渲染。

humanReview:
  required: true
  gate: after_artifact
  title: 审核画面预览
  reviewFocus:
    - 文字是否溢出
    - 画面是否可读
    - 卡片顺序是否正确
    - 是否允许开始最终渲染
  userActions:
    - approve
    - reject
    - regenerate
    - back_to_composition

artifactPolicy:
  produceArtifact: true
  artifactKinds:
    - PREVIEW
    - IMAGE
  defaultReviewRequired: true

nextRecommendedTools:
  - hyperframes_renderer

tags:
  - hyperframes
  - preview
  - snapshot

costLevel: low
riskLevel: low
sideEffect: false
idempotent: true
