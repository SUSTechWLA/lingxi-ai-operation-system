name: composition_quality_checker
description: 检查 VideoCompositionSpec 是否包含完整轨道、时间轴、安全区域和可读性约束。
type: builtin_prompt_tool
executionPlane: cloud
requiresUserDevice: false
artifactLocation: cloud
version: 1.0.0
endpoint: builtin://video-creation/composition_quality_checker
timeout: 60

capabilities:
  - video_creation
  - composition_quality_check
tags:
  - video
  - composition
  - quality

parameters:
  compositionSpec:
    type: object
    required: true

output:
  passed:
    type: boolean
  score:
    type: number
  issues:
    type: array
  repairSuggestions:
    type: array

artifactPolicy:
  produceArtifact: true
  artifactKinds:
    - COMPOSITION_REVIEW
  defaultReviewRequired: false

costLevel: low
riskLevel: low
sideEffect: false
idempotent: true
