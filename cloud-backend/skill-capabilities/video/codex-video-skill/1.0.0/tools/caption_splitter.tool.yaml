name: caption_splitter
description: 将口播脚本拆成适合图文视频卡片和字幕轨的短字幕段落。
type: builtin_prompt_tool
executionPlane: cloud
requiresUserDevice: false
artifactLocation: cloud
version: 1.0.0
endpoint: builtin://video-creation/caption_splitter
timeout: 60

capabilities:
  - video_creation
  - caption_plan
tags:
  - video
  - captions

parameters:
  script:
    type: string
    required: true
    description: 已审核通过的口播稿

output:
  captionPlan:
    type: object
  artifacts:
    type: object

artifactPolicy:
  produceArtifact: true
  artifactKinds:
    - CAPTION_PLAN
  defaultReviewRequired: false

costLevel: low
riskLevel: low
sideEffect: false
idempotent: true
