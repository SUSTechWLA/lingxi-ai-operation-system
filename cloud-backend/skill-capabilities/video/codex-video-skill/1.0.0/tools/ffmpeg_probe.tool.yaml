name: ffmpeg_probe
version: "1.0"
type: local_tool
description: 读取本地 MP4 文件的基础信息：分辨率、编码、时长、码率、音频轨道。

executionPlane: local
requiresUserDevice: true
artifactLocation: local
localCommand: FFMPEG_PROBE

localRequirements:
  os:
    - darwin
    - windows
    - linux
  commands:
    - ffprobe
  minDiskMb: 64
  requiresNetwork: false

capabilities:
  - media_probe
  - video_analysis

parameters:
  input:
    type: string
    required: true
    description: 本地视频文件路径（local://...）。

output:
  success:
    type: boolean
  media:
    type: object
  summary:
    type: string

approvalPolicy:
  required: false

artifactPolicy:
  produceArtifact: true
  artifactKinds:
    - JSON
    - MEDIA_METADATA

nextRecommendedTools:
  - hyperframes_renderer
  - final_review_generator

tags:
  - video
  - probe
  - metadata

costLevel: low
riskLevel: low
sideEffect: false
idempotent: true
