name: capability_preflight
description: 在生成视频前检查文本模型、HyperFrames、Seedance、TTS、ASR 等能力状态并输出建议。
type: builtin_prompt_tool
version: 1.0.0
endpoint: builtin://video-creation/capability_preflight
timeout: 30

capabilities:
  - video_creation
  - capability_preflight
  - videoforge_studio
tags:
  - video
  - preflight
  - capability

parameters:
  brief:
    type: string
    required: false
    description: 用户的视频创作需求
  hyperframesAvailable:
    type: boolean
    required: false
    description: HyperFrames Render Service 是否可用
  seedanceAvailable:
    type: boolean
    required: false
    description: Seedance 或视频生成 Provider 是否可用
  ttsAvailable:
    type: boolean
    required: false
    description: TTS 是否可用

output:
  capabilities:
    type: object
    description: 可用能力、缺口和推荐路径
  content:
    type: string
    description: 人类可读的能力预检摘要
  artifacts:
    type: object
    description: capability_preflight.json 产物索引

costLevel: low
latencyLevel: low
riskLevel: low
sideEffect: false
idempotent: true

artifactPolicy:
  produceArtifact: true
  artifactKinds:
    - JSON
  defaultReviewRequired: false

nextRecommendedTools:
  - proposal_generator
