name: local_job_status_tracker
description: 跟踪本地 HyperFrames 渲染 LocalJob 的状态、进度和错误。
type: builtin_tool
executionPlane: cloud
requiresUserDevice: false
artifactLocation: cloud
version: 1.0.0
endpoint: builtin://video-creation/local_job_status_tracker
timeout: 30

capabilities:
  - video_creation
  - local_job_status

parameters:
  jobId:
    type: string
    required: true

output:
  renderReport:
    type: object
  artifacts:
    type: object

artifactPolicy:
  produceArtifact: true
  artifactKinds:
    - RENDER_REPORT
  defaultReviewRequired: false

costLevel: low
riskLevel: low
sideEffect: false
idempotent: true
