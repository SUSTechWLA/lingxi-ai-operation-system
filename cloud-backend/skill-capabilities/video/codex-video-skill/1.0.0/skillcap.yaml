id: codex-video-skill
name: Codex 视频创作能力包
version: 1.0.0
domain: video_creation
description: Codex 沉淀的视频创作能力，用于生成口播稿、分镜和视频提示词。

activation:
  intents:
    - video_creation
    - knowledge_research
    - fact_checking
    - script_generation
    - storyboard_generation
    - video_prompt_generation
    - publish_copy
    - package_export
  keywords:
    - 视频
    - 口播
    - 分镜
    - shot
    - prompt
    - 知识
    - VideoForge
    - pipeline
    - proposal
    - render strategy
    - 事实
    - 发布
    - 导出
    - 创作包
    - 小红书
    - 短视频

resources:
  - id: global_rules
    type: rule
    path: rules/global.md
    scope: "*"
    load_strategy: full
    priority: 100
  - id: script_rules
    type: rule
    path: rules/script_rules.md
    scope: video_script_generator
    load_strategy: full
    priority: 90
  - id: shot_rules
    type: rule
    path: rules/shot_rules.md
    scope: shot_splitter
    load_strategy: full
    priority: 90
  - id: video_prompt_rules
    type: rule
    path: rules/video_prompt_rules.md
    scope: video_prompt_generator
    load_strategy: full
    priority: 90

tools:
  - id: pipeline_selector
    manifest: tools/pipeline_selector.tool.yaml
  - id: capability_preflight
    manifest: tools/capability_preflight.tool.yaml
  - id: proposal_generator
    manifest: tools/proposal_generator.tool.yaml
  - id: knowledge_researcher
    manifest: tools/knowledge_researcher.tool.yaml
  - id: fact_checker
    manifest: tools/fact_checker.tool.yaml
  - id: video_script_generator
    manifest: tools/video_script_generator.tool.yaml
    prompt: prompts/script_generator.prompt.md
  - id: shot_splitter
    manifest: tools/shot_splitter.tool.yaml
    prompt: prompts/shot_splitter.prompt.md
  - id: visual_feasibility_analyzer
    manifest: tools/visual_feasibility_analyzer.tool.yaml
  - id: render_strategy_planner
    manifest: tools/render_strategy_planner.tool.yaml
  - id: video_prompt_generator
    manifest: tools/video_prompt_generator.tool.yaml
    prompt: prompts/video_prompt_generator.prompt.md
  - id: hyperframes_project_generator
    manifest: tools/hyperframes_project_generator.tool.yaml
  - id: hyperframes_renderer
    manifest: tools/hyperframes_renderer.tool.yaml
  - id: publish_copy_generator
    manifest: tools/publish_copy_generator.tool.yaml
  - id: video_package_exporter
    manifest: tools/video_package_exporter.tool.yaml
  - id: video_composition_builder
    manifest: tools/video_composition_builder.tool.yaml
  - id: hyperframes_snapshot
    manifest: tools/hyperframes_snapshot.tool.yaml
  - id: final_review_generator
    manifest: tools/final_review_generator.tool.yaml
  - id: ffmpeg_probe
    manifest: tools/ffmpeg_probe.tool.yaml
  - id: artifact_packager
    manifest: tools/artifact_packager.tool.yaml
  - id: script_quality_checker
    manifest: tools/script_quality_checker.tool.yaml
  - id: shot_quality_checker
    manifest: tools/shot_quality_checker.tool.yaml
  - id: video_prompt_quality_checker
    manifest: tools/video_prompt_quality_checker.tool.yaml
  - id: package_quality_checker
    manifest: tools/package_quality_checker.tool.yaml
  - id: keyframe_prompt_generator
    manifest: tools/keyframe_prompt_generator.tool.yaml

recipe:
  path: recipe.yaml
  mode: advisory
