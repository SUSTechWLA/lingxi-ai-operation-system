id: creative_director
name: CreativeDirectorAgent
displayName: 创意总监
stage: proposal
goal: 理解用户需求，确定主题、平台、时长、风格和图文视频创作方向。
requiredInputs:
  - USER_REQUEST
requiredOutputs:
  - VIDEO_PROPOSAL
allowedTools:
  - pipeline_selector
  - capability_preflight
  - proposal_generator
forbiddenTools:
  - video_script_generator
  - video_composition_builder
  - hyperframes_project_generator
  - hyperframes_renderer
  - artifact_packager
humanReview:
  required: true
  gate: after_artifact
  title: 审核创作方案
  reviewFocus:
    - 主题是否准确
    - 目标用户是否明确
    - 是否适合图文视频第一版能力
    - 是否继续进入脚本阶段
  userActions:
    - approve
    - edit
    - regenerate
    - reject
maxToolCalls: 5
