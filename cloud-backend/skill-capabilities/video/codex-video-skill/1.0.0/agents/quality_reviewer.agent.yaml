id: quality_reviewer
name: QualityReviewerAgent
displayName: 质量审核员
stage: quality
goal: 检查 final.mp4 是否存在、时长和文件信息是否有效、产物是否完整。
requiredInputs:
  - VIDEO
requiredOutputs:
  - FINAL_REVIEW
allowedTools:
  - ffmpeg_probe
  - final_review_generator
forbiddenTools:
  - video_script_generator
  - hyperframes_renderer
  - artifact_packager
maxToolCalls: 3
