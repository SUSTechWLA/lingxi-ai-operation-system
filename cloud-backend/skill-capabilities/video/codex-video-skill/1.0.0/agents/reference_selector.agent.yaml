id: reference_selector
name: ReferenceSelectorAgent
displayName: 参考资产选择器
stage: reference
goal: 选择图文视频风格参考、背景策略、图标策略和字体策略。
requiredInputs:
  - VIDEO_PROPOSAL
  - VIDEO_COMPOSITION_SPEC
requiredOutputs:
