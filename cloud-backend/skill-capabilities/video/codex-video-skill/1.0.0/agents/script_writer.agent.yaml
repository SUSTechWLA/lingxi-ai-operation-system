id: script_writer
name: ScriptWriterAgent
displayName: 脚本编剧
stage: script
goal: 基于已确认创作方案生成中文图文视频口播脚本。
requiredInputs:
  - VIDEO_PROPOSAL
requiredOutputs:
  - VIDEO_SCRIPT
allowedTools:
  - video_script_generator
  - script_quality_checker
  - knowledge_researcher
  - fact_checker
forbiddenTools:
  - video_composition_builder
  - hyperframes_project_generator
  - hyperframes_renderer
  - artifact_packager
humanReview:
  required: true
  gate: after_artifact
  title: 审核口播脚本
  reviewFocus:
    - 开头是否有钩子
    - 表达是否自然
    - 观点是否准确
    - 是否适合后续拆成卡片
  userActions:
    - approve
    - edit
    - regenerate
    - reject
qualityPolicy:
  required: true
  checkerTool: script_quality_checker
  minScore: 85
  autoRepair: true
  maxRepairAttempts: 1
maxToolCalls: 4
