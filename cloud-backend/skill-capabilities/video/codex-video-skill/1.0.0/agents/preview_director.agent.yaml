id: preview_director
name: PreviewDirectorAgent
displayName: 预览导演
stage: preview
goal: 生成 HyperFrames 项目和预览截图，检查可读性并交给用户确认。
requiredInputs:
  - VIDEO_COMPOSITION_SPEC
  - REFERENCE_ASSET_PLAN
  - CONTINUITY_REPORT
requiredOutputs:
  - HYPERFRAMES_PROJECT
  - PREVIEW_SNAPSHOTS
  - PREVIEW_REPORT
allowedTools:
  - hyperframes_project_generator
  - hyperframes_snapshot
  - preview_quality_checker
forbiddenTools:
  - hyperframes_renderer
  - artifact_packager
humanReview:
  required: true
  gate: after_artifact
  title: 审核画面预览
  reviewFocus:
    - 画面是否可读
    - 字幕是否溢出
    - 卡片顺序是否正确
    - 是否允许最终渲染
  userActions:
    - approve
    - reject
    - regenerate
    - back_to_composition
maxToolCalls: 5
