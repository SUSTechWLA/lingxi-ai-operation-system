services:
  postgres:
    image: postgres:16.14-alpine
    container_name: tangying-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-tangying_db}
    ports:
      - "5432:5432"
    volumes:
      - tangying-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.9-alpine
    container_name: tangying-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - tangying-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redpanda:
    image: redpandadata/redpanda:v26.1.10
    container_name: tangying-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr
      - internal://redpanda:29092,external://localhost:9092
    ports:
      - "9092:9092"
    volumes:
      - tangying-redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --format=json | grep -q '\"is_healthy\":true'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: tangying-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - tangying-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: tangying-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - tangying-qdrant-data:/qdrant/storage

  cloud-backend:
    build:
      context: .
    container_name: tangying-cloud-backend
    restart: unless-stopped
    environment:
      GIN_MODE: release
      APP_ENV: production
      SERVER_PORT: "8080"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-tangying_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: media-assets
      MINIO_USE_SSL: "false"
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?AUTH_TOKEN_SECRET is required}
      TOOL_REGISTRATION_INTERNAL_TOKEN: ${TOOL_REGISTRATION_INTERNAL_TOKEN:?TOOL_REGISTRATION_INTERNAL_TOKEN is required}
      OBSERVABILITY_SEALING_KEY: ${OBSERVABILITY_SEALING_KEY:?OBSERVABILITY_SEALING_KEY is required}
      OBSERVABILITY_SEALING_DOMAIN: ${OBSERVABILITY_SEALING_DOMAIN:-cloud-agent-terminal-v1}
      OBSERVABILITY_SOURCE_ENVIRONMENT: ${OBSERVABILITY_SOURCE_ENVIRONMENT:-production}
      OBSERVABILITY_PREVIOUS_SOURCE_ENVIRONMENTS: ${OBSERVABILITY_PREVIOUS_SOURCE_ENVIRONMENTS:-}
      OBSERVABILITY_SOURCE_MIGRATION_APPROVED: ${OBSERVABILITY_SOURCE_MIGRATION_APPROVED:-none}
      AUTH_ACCESS_TOKEN_TTL_SECONDS: "3600"
      AUTH_REFRESH_TOKEN_TTL_SECONDS: "2592000"
      ORCHESTRATOR_URL: http://cloud-backend:8080
      CONTEXT_SERVICE_URL: http://cloud-backend:8080
      VIDEO_CREATION_ENABLED: "true"
      LOCAL_RUNNER_ENABLED: "true"
      MODEL_PROVIDER_MODE: fake
      SKILL_ROOT: /app/skills
      SKILL_CAPABILITY_ROOT: /app/skill-capabilities
      AIOS_VIDEO_PIPELINE_ROOT: /app/video-pipelines
      AGENT_PLANNER_MODE: hybrid
      HYPERFRAMES_MODE: service
      HYPERFRAMES_SERVICE_URL: http://host.docker.internal:8787
      HYPERFRAMES_PROJECT_ROOT: /data/aios/projects
      HYPERFRAMES_OUTPUT_ROOT: /data/aios/projects
      SANDBOX_ENABLED: "true"
      SANDBOX_ADDRESS: ${SANDBOX_ADDRESS:-host.docker.internal:50051}
      SANDBOX_FALLBACK: "false"
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - tangying-project-data:/data/aios/projects
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:8080/api/health/ready"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 15s

volumes:
  tangying-postgres-data:
  tangying-redis-data:
  tangying-redpanda-data:
  tangying-minio-data:
  tangying-qdrant-data:
  tangying-project-data:
