services:
  postgres:
    image: postgres:16-alpine
    container_name: tangying-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-tangying_db}
    ports:
      - "5530:5432"

  redis:
    image: redis:7-alpine
    container_name: tangying-redis
    ports:
      - "6379:6379"

  redpanda:
    image: redpandadata/redpanda:latest
    container_name: tangying-redpanda
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
    ports:
      - "9092:9092"

  minio:
    image: minio/minio:latest
    container_name: tangying-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: tangying-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
