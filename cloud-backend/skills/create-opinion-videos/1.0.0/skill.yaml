name: create-opinion-videos
version: "1.0.0"
display_name: 口播 / 知识视频
description: 口播 / 知识视频流水线：观点澄清、讲稿生成、可视化包装、参考帧请求、视频素材包、标题简介关键词。
category: video
stages:
  - name: viewpoint_dossier
    instruction: stages/viewpoint_dossier.md

  - name: recording_script
    instruction: stages/recording_script.md
    approval_required: true
    input:
      dossier_ref: "{{viewpoint_dossier.output.content}}"

  - name: hyperframes_reference
    instruction: stages/hyperframes_reference.md
    approval_required: true
    input:
      script_ref: "{{recording_script_exec.output.content}}"

  - name: image_assets
    kind: TOOL
    tool: image_asset_generator
    instruction: stages/image_assets.md
    optional: true
    approval_required: true
    long_running: true
    heartbeat_timeout_sec: 900
    input:
      asset_plan_ref: "{{hyperframes_reference_exec.output.content}}"

  - name: hyperframes_build
    kind: TOOL
    tool: hyperframes_project_builder
    instruction: stages/hyperframes_build.md
    long_running: true
    heartbeat_timeout_sec: 1200
    input:
      reference_ref: "{{hyperframes_reference_exec.output.content}}"
      assets_ref: "{{image_assets_exec.output.content}}"

  - name: hyperframes_render
    kind: TOOL
    tool: hyperframes_renderer
    instruction: stages/hyperframes_render.md
    long_running: true
    heartbeat_timeout_sec: 1800
    input:
      project_ref: "{{hyperframes_build.output.content}}"

  - name: render_review
    instruction: stages/render_review.md
    approval_required: true
    input:
      script_ref: "{{recording_script_exec.output.content}}"
      reference_ref: "{{hyperframes_reference_exec.output.content}}"
      render_ref: "{{hyperframes_render.output.content}}"

  - name: publish_package
    instruction: stages/publish_package.md
    input:
      script_ref: "{{recording_script_exec.output.content}}"
      reference_ref: "{{hyperframes_reference_exec.output.content}}"
      render_ref: "{{hyperframes_render.output.content}}"
      review_ref: "{{render_review_exec.output.content}}"
