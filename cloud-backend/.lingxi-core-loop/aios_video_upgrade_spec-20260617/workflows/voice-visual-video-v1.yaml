id: voice-visual-video
version: 1.0.0
name: 文字口播可视化视频
category: video
inputSchemaRef: skills/voice-visual-video/1.0.0/schemas/project-input.schema.json

stages:
  - id: opinion_intent
    name: 观点与意图结构化
    kind: AGENT
    skillStage: opinion_intent
    rerunScope: STAGE_DOWNSTREAM

  - id: narration_script
    name: 口播稿与 Beat
    kind: AGENT
    skillStage: narration
    dependsOn: [opinion_intent]
    outputSchemaRef: schemas/narration.schema.json

  - id: narration_approval
    name: 口播稿审核
    kind: APPROVAL
    dependsOn: [narration_script]
    approvalRequired: true

  - id: audio_bind
    name: 绑定录音或 TTS
    kind: TOOL
    tool: audio_bind
    dependsOn: [narration_approval]

  - id: narration_timing
    name: 音频时间对齐
    kind: TOOL
    tool: narration_timing
    dependsOn: [audio_bind]

  - id: visual_document
    name: 视频视觉参考文档
    kind: AGENT
    skillStage: visual_document
    dependsOn: [narration_timing]

  - id: visual_beats
    name: VisualBeat 规划
    kind: AGENT
    skillStage: visual_beats
    dependsOn: [visual_document]
    outputSchemaRef: schemas/visual-beats.schema.json

  - id: component_plan
    name: 组件 DSL
    kind: FOREACH
    foreach: $.project.visualBeats
    skillStage: component_plan
    dependsOn: [visual_beats]
    rerunScope: UNIT_DOWNSTREAM

  - id: optional_images
    name: 可选图片生成
    kind: FOREACH
    foreach: $.project.visualBeats[?(@.needsImage)]
    tool: image_generator
    dependsOn: [component_plan]
    rerunScope: UNIT_DOWNSTREAM

  - id: hypergen_bundle
    name: HyperGen 工程 Bundle
    kind: TOOL
    tool: hypergen_bundle_builder
    dependsOn: [component_plan, optional_images]

  - id: local_render
    name: Electron 本地渲染
    kind: LOCAL_TOOL
    tool: HYPERGEN_RENDER
    dependsOn: [hypergen_bundle]

  - id: render_review
    name: 渲染审核
    kind: AGENT
    skillStage: render_review
    dependsOn: [local_render]

  - id: final_approval
    name: 成片审核
    kind: APPROVAL
    dependsOn: [render_review]
    approvalRequired: true

  - id: publication_package
    name: 发布资料
    kind: AGENT
    skillStage: publication
    dependsOn: [final_approval]
