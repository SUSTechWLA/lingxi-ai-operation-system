name: Desktop Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    name: validate-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate version and release ancestry
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/release-version-check.sh
          git fetch origin release
          git merge-base --is-ancestor "$GITHUB_SHA" origin/release

  build-macos:
    name: macOS-${{ matrix.arch }}
    needs: validate
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: local-backend/go.sum

      - name: Build bundled local agent
        working-directory: local-backend
        shell: bash
        run: |
          mkdir -p ../frontend/resources/bin
          GOOS=darwin GOARCH=${{ matrix.arch }} go build -o ../frontend/resources/bin/tangying-local-agent ./cmd/local-agent

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Package unsigned macOS client
        working-directory: frontend
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg --${{ matrix.arch }} --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: tangying-macos-${{ matrix.arch }}
          path: frontend/release/*.dmg
          if-no-files-found: error

  publish:
    name: publish-github-release
    needs: build-macos
    runs-on: ubuntu-latest

    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: tangying-macos-*
          path: dist
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.dmg --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.dmg \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
