name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_REF: ${{ inputs.tag || github.ref }}

permissions:
  contents: write

jobs:
  validate:
    name: validate-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_REF }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate version and release ancestry
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$RELEASE_TAG" bash scripts/release-version-check.sh
          git fetch origin release --tags
          release_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          test -n "$release_sha"
          git merge-base --is-ancestor "$release_sha" origin/release

  build-macos:
    name: macOS-${{ matrix.electron_arch }}
    needs: validate
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - electron_arch: arm64
            go_arch: arm64
          - electron_arch: x64
            go_arch: amd64

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache-dependency-path: local-backend/go.sum

      - name: Build bundled local agent
        working-directory: local-backend
        shell: bash
        run: |
          mkdir -p ../frontend/resources/bin
          CGO_ENABLED=0 GOOS=darwin GOARCH=${{ matrix.go_arch }} go build -o ../frontend/resources/bin/tangying-local-agent ./cmd/local-agent

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Package unsigned macOS client
        working-directory: frontend
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg --${{ matrix.electron_arch }} --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: tangying-macos-${{ matrix.electron_arch }}
          path: frontend/release/*.dmg
          if-no-files-found: error

  publish:
    name: publish-github-release
    needs: build-macos
    runs-on: ubuntu-latest

    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: tangying-macos-*
          path: dist
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.dmg --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.dmg \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
