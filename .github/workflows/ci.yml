name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            hyperframes-render-service/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Check whitespace in changed files
        shell: bash
        run: |
          set -euo pipefail
          zero_sha=0000000000000000000000000000000000000000

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          elif [[ -n "${{ github.event.before }}" && "${{ github.event.before }}" != "$zero_sha" ]]; then
            git diff --check "${{ github.event.before }}..HEAD"
          else
            git diff-tree --check --root -r HEAD
          fi

  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            hyperframes-render-service/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install HyperFrames render service dependencies
        working-directory: hyperframes-render-service
        run: npm ci

      - name: Build HyperFrames render service
        working-directory: hyperframes-render-service
        run: npm run build

      - name: Audit HyperFrames render service runtime dependencies
        working-directory: hyperframes-render-service
        run: npm audit --omit=dev --registry=https://registry.npmjs.org

  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend director smoke test
        working-directory: frontend
        run: npm run test:director

      - name: Run Electron runtime tests
        working-directory: frontend
        run: |
          node electron/local-agent-runtime.test.cjs
          node electron/file-access-runtime.test.cjs

      - name: Audit frontend runtime dependencies
        working-directory: frontend
        run: npm audit --omit=dev --registry=https://registry.npmjs.org

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: |
            cloud-backend/go.sum
            local-backend/go.sum

      - name: Test cloud backend
        working-directory: cloud-backend
        run: go test ./...

      - name: Test local backend
        working-directory: local-backend
        run: go test ./...

      - name: Test video QA MCP service
        run: python3 -m unittest discover -s mcp/video_qa -p 'test*.py'
