server:
  port: 8081

spring:
  application:
    name: nl-translator

openai:
  api-key: ${OPENAI_API_KEY:d5c51fd9-4a2e-455e-af6f-47de85eadf95}
  base-url: ${OPENAI_BASE_URL:https://ark.cn-beijing.volces.com/api/coding/v3}
  model: doubao-seed-2.0-pro
  temperature: 0.7
  max-tokens: 2000
  timeout: 30000

orchestrator:
  url: ${ORCHESTRATOR_URL:http://localhost:8080}

logging:
  level:
    com.lingxi.ai.translator: INFO
