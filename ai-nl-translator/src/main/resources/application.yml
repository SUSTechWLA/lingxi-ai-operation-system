server:
  port: 8081

spring:
  application:
    name: nl-translator

openai:
  api-key: ${OPENAI_API_KEY}
  base-url: ${OPENAI_BASE_URL:https://ark.cn-beijing.volces.com/api/coding/v3}
  model: ${OPENAI_MODEL:doubao-seed-2.0-pro}
  temperature: ${OPENAI_TEMPERATURE:0.7}
  max-tokens: ${OPENAI_MAX_TOKENS:2000}
  timeout: ${OPENAI_TIMEOUT:30000}

orchestrator:
  url: ${ORCHESTRATOR_URL:http://localhost:8080}

logging:
  level:
    com.lingxi.ai.translator: INFO
