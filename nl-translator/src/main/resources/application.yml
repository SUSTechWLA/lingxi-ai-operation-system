server:
  port: 8081

spring:
  application:
    name: nl-translator

openai:
  api-key: ${OPENAI_API_KEY:your-api-key-here}
  model: gpt-4-turbo-preview
  temperature: 0.7
  max-tokens: 2000
  timeout: 30000

orchestrator:
  url: ${ORCHESTRATOR_URL:http://localhost:8080}

logging:
  level:
    com.lingxi.ai.translator: INFO
